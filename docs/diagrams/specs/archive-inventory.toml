# Stepped diagram: what `archive inventory` reads and writes for one zone.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-inventory.toml
#
# How this file works: see manual-listing-check.toml. Each element's `step` is where it first appears.
# Colors, sizes and wording follow the style rules in docs/diagrams/README.md.

name = "archive-inventory"
title = "Inventory: check a zone's listings against the catalog"
width = 1600
height = 820

[[steps]]
caption = "`archive inventory --zone I1` finds I1's two library listings, Navy and DOH, from the links in `catalog/zones.csv`."

[[steps]]
caption = "On each listing it picks \"Sort by System Filename\" and \"Show 100 Items\", like the manual check, then reads every page. The default sort can skip or repeat files between pages."

[[steps]]
caption = "Each result's library ID comes from its link (`aFile2925` is `pub_002925`). If the site shows \"Application Error\", it tries again, up to 3 times."

[[steps]]
caption = "Each library ID is matched to `catalog/documents.csv`: `matched`, `not_in_catalog` (listed, no catalog row) or `not_on_listing` (catalog row, not listed). The catalog is not changed."

[[steps]]
caption = "It writes `reports/<date>-inventory-I1.csv`, one row per result. On 2026-11-17: Navy 109 and DOH 14, all 123 `matched`."

