# Stepped diagram: what `archive validate` reads and checks.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-validate.toml
#
# How this file works: see manual-listing-check.toml. Each element's `step` is where it first appears.
# Colors, sizes and wording follow the style rules in docs/diagrams/README.md.

name = "archive-validate"
title = "Validate: check the catalog follows its rules"
width = 1600
height = 700

[[steps]]
caption = "`archive validate` reads `catalog/documents.csv`, `zones.csv` and `communities.csv`."

[[steps]]
caption = "It checks each file's columns against `catalog/README.md`, then every row: values in the vocabulary, IDs, dates, UTC times, fingerprints and `; ` lists."

[[steps]]
caption = "It checks values that must agree: a stage only on emergency response rows, a period that fits the phase, a `done` row with a `local_path`, and a `duplicate_of` that points to a real row."

[[steps]]
caption = "It prints each problem with its file, line, ID and column, or \"No problems\", and changes nothing. GitHub runs it on every push, so a broken catalog fails the checks."

