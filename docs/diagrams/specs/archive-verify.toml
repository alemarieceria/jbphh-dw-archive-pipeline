# Stepped diagram: what `archive verify` checks for one zone.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-verify.toml
#
# How this file works: see manual-listing-check.toml. Each element's `step` is where it first appears.
# Colors, sizes and wording follow the style rules in docs/diagrams/README.md.

name = "archive-verify"
title = "Verify: prove a zone's archive is complete"
width = 1600
height = 800

[[steps]]
caption = "`archive verify --zone I1` reads I1's rows in `catalog/documents.csv`: every row whose `zones` lists I1 or `all`, so plans for all zones count too."

[[steps]]
caption = "Files: it reads every file of each `done` row on the Shared Drive. A file that is missing, or differs from its recorded fingerprint, fails the check."

[[steps]]
caption = "Drive: it lists any file in `raw/` or `web-captures/` that no catalog row lists, so nothing is saved without being cataloged."

[[steps]]
caption = "It matches I1's Navy and DOH listings to the catalog, as `archive inventory` does, then checks the catalog's rules, as `archive validate` does."

[[steps]]
caption = "It prints PASS or FAIL per check, counts rows by status and lists the known gaps. It writes a dated report and never changes the catalog."

