# Stepped diagram: the archive pipeline, from the website to the tools that read it.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-pipeline.toml
#
# How this file works: see listing-check-by-hand.toml. Each element's `step` is where it first appears.
# Colors follow the Red Hill tools design system (docs/design_system.md in the Directory repo):
#   automatic step  #e4ece7 fill, #1f5c4a border    step done by hand  #f8efe7, #8c4a35 (thick border)
#   data comes from or goes  #e6eef6, #2d5b85      data is stored  #dcd6cc, #443f38 (thick border)
#   automatic checks  white, dashed #625b53        text  #1c1a17, secondary text #443f38

name = "archive-pipeline"
title = "Archive pipeline (planned): one zone at a time"
width = 1600
height = 900

[[steps]]
caption = "`archive discover` reads every zone page and library listing on the Safe Waters site, plus the Navy and DOH files they link to, and proposes catalog rows. Its dated report lists new files, changed files and files the site no longer shows."

[[steps]]
caption = "You review the proposals: one decision per listing, and flagged rows one by one. Nothing reaches the catalog without your approval."

[[steps]]
caption = "`archive merge` shows a dry run, then `--apply` writes the approved rows to the catalog in this repo and gives each new document a `doc_id`. It never overwrites a value you reviewed."

[[steps]]
caption = "`archive download` saves emergency response files to the Shared Drive's `raw/` folder and records each file's SHA-256 fingerprint. Monitoring documents stay `link_only`: cataloged and linked, not downloaded."

[[steps]]
caption = "`archive verify` checks every saved file against its recorded fingerprint, so a changed or damaged file is caught."

[[steps]]
caption = "`archive publish` writes read-only copies of the catalog and an index for each zone, for the Explorer, the Evidence Tracer and the team database."

[[steps]]
caption = "GitHub Actions runs the tests and catalog checks on every change and checks the live site weekly. Any time, `uv run archive status` shows plain counts by zone and status."

