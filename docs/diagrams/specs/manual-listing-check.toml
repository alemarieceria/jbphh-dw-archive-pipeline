# Stepped diagram: checking one zone's library listing manually.
# Build it with: uv run archive diagrams build docs/diagrams/specs/manual-listing-check.toml
#
# How this file works:
# - [[steps]]: one caption per step, in order. The caption shows under the drawing.
# - [[elements]]: the boxes, text and arrows. `step` is the step where each one first
#   appears; it stays visible after that. Positions are in pixels from the top left.
# - Screenshots: type = "image" with `src` (relative to this file) and `width`; the height
#   follows from the image. Draw highlight rectangles after an image so they sit on top.
# - Colors, sizes and wording follow the style rules in docs/diagrams/README.md. Here each
#   callout's color only pairs its highlight with its label, so there is no legend.
# - A label's text takes its box's color unless it sets its own strokeColor, so every
#   label sets strokeColor = "#1c1a17".

name = "manual-listing-check"
title = "Check a zone's listing manually"
width = 1240
height = 760

[[steps]]
caption = "Open the listing address in any web browser. Two parts of it change for each listing; the next two steps show which. `%20` is how a web address writes a space, so leave those as they are. Checking a listing doesn't download or change anything."

[[steps]]
caption = "First part: who posted the reports. Use `Navy` or `DoH`, written exactly like that."

[[steps]]
caption = "Second part: the zone ID. Use one of the 19 zones with emergency response documents: A1, A2, A3, B1, C1, C2, C3, D1, D2, D3, D4, E1, F1, F2, G1, H1, H2, H3 or I1. Zone J1 (Manana Housing) was added during the EDWM phase, so it has no emergency response documents to download."

[[steps]]
caption = "Find the total at the bottom of the results. For the Navy listing of Zone I1 it says \"1 - 10 of 109 Results\", so 109 is the number to match."

[[steps]]
caption = "Above the results, change two menus: \"Sort by Rank (DESC)\" to \"Sort by System Filename\", and \"Show 10 Items\" to \"Show 100 Items\". Always sort: the default order can skip or repeat files between pages. 109 results then fit on 2 pages."

[[steps]]
caption = "Click the next page arrow to go through every page. The web address doesn't change between pages, so keep clicking until you reach the last page."

[[steps]]
caption = "On every result, note the file name. `pub_002925.pdf` means library ID 2925."

[[steps]]
caption = "Find each file name in the catalog (`registry/documents.csv`, `library_id` column) and check that its status is `done`. Checked 2026-11-05: all 109 Navy I1 files matched and were `done`."

# ---- Steps 1 to 3: the listing address, with the two parts to change marked ----

[[elements]]
step = 1
type = "rectangle"
x = 0
y = 0
width = 1240
height = 760
backgroundColor = "#fbf8f3"
fillStyle = "solid"
strokeColor = "transparent"
strokeWidth = 0

[[elements]]
step = 1
type = "text"
x = 356
y = 20
text = "Check a zone's listing manually"
fontSize = 36
strokeColor = "#1c1a17"

[[elements]]
step = 1
type = "text"
x = 154
y = 70
text = "How to check, without code, that the archive holds every file in a zone's library listing."
fontSize = 22
strokeColor = "#443f38"

[[elements]]
step = 1
type = "rectangle"
x = 40
y = 110
width = 1160
height = 120
roundness = { type = 3 }
strokeColor = "#625b53"
backgroundColor = "#ffffff"
fillStyle = "solid"

[[elements]]
step = 1
type = "text"
x = 60
y = 128
text = "https://jbphh-safewaters.org/public/library/searchresults.aspx?dsn=pub&category=JBPHH"
fontSize = 22
strokeColor = "#1c1a17"

# A "marked" line: text in [brackets] gets a tinted box behind it, at the step given in
# `marks` (one mark per bracketed part, in order). `arrowTo` draws an arrow from the box to that point.
[[elements]]
step = 1
type = "marked"
x = 60
y = 170
text = "&subcategory=[Navy]%20Flushing%20Zone%20[I1]"
fontSize = 22
strokeColor = "#1c1a17"
marks = [
  { step = 2, strokeColor = "#2d5b85", backgroundColor = "#e6eef6", arrowTo = [205, 268] },
  { step = 3, strokeColor = "#1f5c4a", backgroundColor = "#e4ece7", arrowTo = [655, 268] },
]

[[elements]]
step = 2
type = "rectangle"
x = 40
y = 270
width = 330
height = 100
roundness = { type = 3 }
strokeColor = "#2d5b85"
backgroundColor = "#e6eef6"
fillStyle = "solid"
label = { text = "Who posted it\n`Navy`  or  `DoH`\n(written exactly like this)", fontSize = 20, strokeColor = "#1c1a17" }

[[elements]]
step = 3
type = "rectangle"
x = 420
y = 270
width = 470
height = 100
roundness = { type = 3 }
strokeColor = "#1f5c4a"
backgroundColor = "#e4ece7"
fillStyle = "solid"
label = { text = "Zone ID, one of these 19:\nA1 A2 A3 B1 C1 C2 C3 D1 D2 D3\nD4 E1 F1 F2 G1 H1 H2 H3 I1", fontSize = 20, strokeColor = "#1c1a17" }

