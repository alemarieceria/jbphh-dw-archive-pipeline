# Stepped diagram: what `archive discover` reads and writes for one zone.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-discover.toml
#
# How this file works: see manual-listing-check.toml. Each element's `step` is where it first appears.
# Colors, sizes and wording follow the style rules in docs/diagrams/README.md.

name = "archive-discover"
title = "Discover: propose a zone's catalog rows"
width = 1600
height = 820

[[steps]]
caption = "`archive discover --zone I1` first reads all 20 zone pages on the Safe Waters site: each page's \"Last Updated\" date and every link. That way each document lists every zone that posts it. The 4 EDWM Waiawa Shaft files are on all 20 pages."

[[steps]]
caption = "On I1's page, each link takes its group, phase, and stage or period from its section and the bold line above it (\"Stage 4\", \"Period 3\", \"Quarter 2\"). The interactive map sits outside the sections, so it is flagged."

[[steps]]
caption = "Next it reads I1's Navy, DOH and LTM listings, sorted by System Filename, 100 per page. Each result takes its phase and stage from the zone page's link to its listing. New results get `doc_type`, `sdg` and level from their titles."

[[steps]]
caption = "Each document is compared with `catalog/documents.csv` and marked `matched`, `changed`, `new` or `missing`. The catalog itself is not changed."

[[steps]]
caption = "It writes the review file, `reports/<date>-discover-I1.csv`: one row per source with its count, then that source's documents. For I1 on 2026-11-17: 132 matched, 179 new `link_only`, 1 flagged (the map)."

[[steps]]
caption = "You review it: one `decision` per source, and flagged rows one by one. `archive merge` (not built yet) will apply the approved rows."

