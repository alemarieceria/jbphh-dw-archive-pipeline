# Stepped diagram: what `archive merge` reads and writes.
# Build it with: uv run archive diagrams build docs/diagrams/specs/archive-merge.toml
#
# How this file works: see manual-listing-check.toml. Each element's `step` is where it first appears.
# Colors, sizes and wording follow the style rules in docs/diagrams/README.md.

name = "archive-merge"
title = "Merge: apply a review file to the catalog"
width = 1600
height = 820

[[steps]]
caption = "`archive merge reports/<date>-discover-I1.csv` reads the review file and `catalog/documents.csv`."

[[steps]]
caption = "It compares the catalog's fingerprint with the review file's `catalog_sha256`. If the catalog changed since the file was made, it stops and writes nothing."

[[steps]]
caption = "It reads each `decision`: a source row's covers its unflagged rows, and a flagged row needs its own. Anything other than `accept`, `reject` or blank stops it."

[[steps]]
caption = "For each accepted row: `new` gets the next `doc_id`; `matched` gets its blank discovery columns and `stage` filled; `changed` takes the site's value and keeps the old one in `notes`; `missing` gets a dated note."

[[steps]]
caption = "Without `--apply`, it only shows what would change. With `--apply`, it writes `catalog/documents.csv`; you commit it and run `archive publish`."

