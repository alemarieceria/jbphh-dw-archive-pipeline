<iframe title="Verify: prove a zone&#x27;s archive is complete" aria-label="Verify: prove a zone&#x27;s archive is complete, in 5 steps. Step 1: `archive verify --zone I1` reads I1&#x27;s rows in `catalog/documents.csv`: every row whose `zones` lists I1 or `all`, so plans for all zones count too. Step 2: Files: it reads every file of each `done` row on the Shared Drive. A file that is missing, or differs from its recorded fingerprint, fails the check. Step 3: Drive: it lists any file in `raw/` or `web-captures/` that no catalog row lists, so nothing is saved without being cataloged. Step 4: It matches I1&#x27;s Navy and DOH listings to the catalog, as `archive inventory` does, then checks the catalog&#x27;s rules, as `archive validate` does. Step 5: It prints PASS or FAIL per check, counts rows by status and lists the known gaps. It writes a dated report and never changes the catalog." srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;

&lt;script&gt;
const captions = [&quot;`archive verify --zone I1` reads I1&#x27;s rows in `catalog/documents.csv`: every row whose `zones` lists I1 or `all`, so plans for all zones count too.&quot;, &quot;Files: it reads every file of each `done` row on the Shared Drive. A file that is missing, or differs from its recorded fingerprint, fails the check.&quot;, &quot;Drive: it lists any file in `raw/` or `web-captures/` that no catalog row lists, so nothing is saved without being cataloged.&quot;, &quot;It matches I1&#x27;s Navy and DOH listings to the catalog, as `archive inventory` does, then checks the catalog&#x27;s rules, as `archive validate` does.&quot;, &quot;It prints PASS or FAIL per check, counts rows by status and lists the known gaps. It writes a dated report and never changes the catalog.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
function fit() { if (frameElement) frameElement.style.height = document.body.offsetHeight + &quot;px&quot;; }
addEventListener(&quot;load&quot;, fit);
addEventListener(&quot;resize&quot;, fit);
show(0);
