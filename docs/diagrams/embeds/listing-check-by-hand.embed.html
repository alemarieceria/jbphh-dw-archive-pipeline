&lt;script&gt;
const captions = [&quot;Open the listing address in any web browser. Two parts of it change for each listing; the next two steps show which. %20 is how a web address writes a space, so leave those as they are.&quot;, &quot;First part: who posted the reports. Use Navy or DoH, written exactly like that.&quot;, &quot;Second part: the zone ID. Use one of the 19 zones with emergency response documents: A1, A2, A3, B1, C1, C2, C3, D1, D2, D3, D4, E1, F1, F2, G1, H1, H2, H3 or I1. Zone J1 (Manana Housing) was added during the EDWM phase, so it has no emergency response documents to download.&quot;, &quot;Find the total at the bottom of the results. For the Navy listing of Zone I1 it says 1 - 10 of 109 Results, so 109 is the number to match.&quot;, &quot;Above the results, change two menus: Sort by Rank (DESC) to Sort by System Filename, and Show 10 Items to Show 100 Items. Always sort: the default order can skip or repeat files between pages. 109 results then fit on 2 pages.&quot;, &quot;Click the Next page arrow to go through every page. The web address doesn&#x27;t change between pages, so keep clicking until you reach the last page.&quot;, &quot;On every result, note the file name. pub_002925.pdf means library ID 2925.&quot;, &quot;Find each file name in the catalog (registry/documents.csv, library_id column) and check that its status is done. Checked 2026-11-05: all 109 Navy I1 files matched and were done.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
function fit() { if (frameElement) frameElement.style.height = document.body.offsetHeight + &quot;px&quot;; }
addEventListener(&quot;load&quot;, fit);
addEventListener(&quot;resize&quot;, fit);
show(0);
