<iframe title="Merge: apply a review file to the catalog" aria-label="Merge: apply a review file to the catalog, in 5 steps. Step 1: `archive merge reports/&lt;date&gt;-discover-I1.csv` reads the review file and `catalog/documents.csv`. Step 2: It compares the catalog&#x27;s fingerprint with the review file&#x27;s `catalog_sha256`. If the catalog changed since the file was made, it stops and writes nothing. Step 3: It reads each `decision`: a source row&#x27;s covers its unflagged rows, and a flagged row needs its own. Anything other than `accept`, `reject` or blank stops it. Step 4: For each accepted row: `new` gets the next `doc_id`; `matched` gets its blank discovery columns and `stage` filled; `changed` takes the site&#x27;s value and keeps the old one in `notes`; `missing` gets a dated note. Step 5: Without `--apply`, it only shows what would change. With `--apply`, it writes `catalog/documents.csv`; you commit it and run `archive publish`." srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;

&lt;script&gt;
const captions = [&quot;`archive merge reports/&lt;date&gt;-discover-I1.csv` reads the review file and `catalog/documents.csv`.&quot;, &quot;It compares the catalog&#x27;s fingerprint with the review file&#x27;s `catalog_sha256`. If the catalog changed since the file was made, it stops and writes nothing.&quot;, &quot;It reads each `decision`: a source row&#x27;s covers its unflagged rows, and a flagged row needs its own. Anything other than `accept`, `reject` or blank stops it.&quot;, &quot;For each accepted row: `new` gets the next `doc_id`; `matched` gets its blank discovery columns and `stage` filled; `changed` takes the site&#x27;s value and keeps the old one in `notes`; `missing` gets a dated note.&quot;, &quot;Without `--apply`, it only shows what would change. With `--apply`, it writes `catalog/documents.csv`; you commit it and run `archive publish`.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
function fit() { if (frameElement) frameElement.style.height = document.body.offsetHeight + &quot;px&quot;; }
addEventListener(&quot;load&quot;, fit);
addEventListener(&quot;resize&quot;, fit);
show(0);
