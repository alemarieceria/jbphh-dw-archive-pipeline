<iframe title="Discover: propose a zone&#x27;s catalog rows" aria-label="Discover: propose a zone&#x27;s catalog rows, in 6 steps. Step 1: `archive discover --zone I1` first reads all 20 zone pages on the Safe Waters site: each page&#x27;s &quot;Last Updated&quot; date and every link. That way each document lists every zone that posts it. The 4 EDWM Waiawa Shaft files are on all 20 pages. Step 2: On I1&#x27;s page, each link takes its group, phase, and stage or period from its section and the bold line above it (&quot;Stage 4&quot;, &quot;Period 3&quot;, &quot;Quarter 2&quot;). The interactive map sits outside the sections, so it is flagged. Step 3: Next it reads I1&#x27;s Navy, DOH and LTM listings, sorted by System Filename, 100 per page. Each result takes its phase and stage from the zone page&#x27;s link to its listing. New results get `doc_type`, `sdg` and level from their titles. Step 4: Each document is compared with `catalog/documents.csv` and marked `matched`, `changed`, `new` or `missing`. The catalog itself is not changed. Step 5: It writes the review file, `reports/&lt;date&gt;-discover-I1.csv`: one row per source with its count, then that source&#x27;s documents. For I1 on 2026-11-17: 132 matched, 179 new `link_only`, 1 flagged (the map). Step 6: You review it: one `decision` per source, and flagged rows one by one. `archive merge` (not built yet) will apply the approved rows." srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;

&lt;script&gt;
const captions = [&quot;`archive discover --zone I1` first reads all 20 zone pages on the Safe Waters site: each page&#x27;s \&quot;Last Updated\&quot; date and every link. That way each document lists every zone that posts it. The 4 EDWM Waiawa Shaft files are on all 20 pages.&quot;, &quot;On I1&#x27;s page, each link takes its group, phase, and stage or period from its section and the bold line above it (\&quot;Stage 4\&quot;, \&quot;Period 3\&quot;, \&quot;Quarter 2\&quot;). The interactive map sits outside the sections, so it is flagged.&quot;, &quot;Next it reads I1&#x27;s Navy, DOH and LTM listings, sorted by System Filename, 100 per page. Each result takes its phase and stage from the zone page&#x27;s link to its listing. New results get `doc_type`, `sdg` and level from their titles.&quot;, &quot;Each document is compared with `catalog/documents.csv` and marked `matched`, `changed`, `new` or `missing`. The catalog itself is not changed.&quot;, &quot;It writes the review file, `reports/&lt;date&gt;-discover-I1.csv`: one row per source with its count, then that source&#x27;s documents. For I1 on 2026-11-17: 132 matched, 179 new `link_only`, 1 flagged (the map).&quot;, &quot;You review it: one `decision` per source, and flagged rows one by one. `archive merge` (not built yet) will apply the approved rows.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
function fit() { if (frameElement) frameElement.style.height = document.body.offsetHeight + &quot;px&quot;; }
addEventListener(&quot;load&quot;, fit);
addEventListener(&quot;resize&quot;, fit);
show(0);
