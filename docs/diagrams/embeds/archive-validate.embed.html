<iframe title="Validate: check the catalog follows its rules" aria-label="Validate: check the catalog follows its rules, in 4 steps. Step 1: `archive validate` reads `catalog/documents.csv`, `document_links.csv`, `zones.csv` and `communities.csv`. Step 2: It checks each file&#x27;s columns against `catalog/README.md`, then every row: values in the vocabulary, IDs, dates, UTC times, fingerprints and `; ` lists. Step 3: It checks values that must agree: a stage only on emergency response rows, a period that fits the phase, a `done` row with a `local_path`, a `duplicate_of` that points to a real row, and links between real rows, with `same_results` going from the lower package level to the higher. Step 4: It prints each problem with its file, line, ID and column, or &quot;No problems&quot;, and changes nothing. GitHub runs it on every push, so a broken catalog fails the checks." srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;

&lt;script&gt;
const captions = [&quot;`archive validate` reads `catalog/documents.csv`, `document_links.csv`, `zones.csv` and `communities.csv`.&quot;, &quot;It checks each file&#x27;s columns against `catalog/README.md`, then every row: values in the vocabulary, IDs, dates, UTC times, fingerprints and `; ` lists.&quot;, &quot;It checks values that must agree: a stage only on emergency response rows, a period that fits the phase, a `done` row with a `local_path`, a `duplicate_of` that points to a real row, and links between real rows, with `same_results` going from the lower package level to the higher.&quot;, &quot;It prints each problem with its file, line, ID and column, or \&quot;No problems\&quot;, and changes nothing. GitHub runs it on every push, so a broken catalog fails the checks.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
