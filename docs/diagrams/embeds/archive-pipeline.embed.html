<iframe title="Archive pipeline: one zone at a time" aria-label="Archive pipeline: one zone at a time, in 7 steps. Step 1: `archive discover` reads every zone page and library listing on the Safe Waters site, plus the Navy and DOH files they link to, and proposes catalog rows. Its dated report lists new files, changed files and files the site no longer shows. Step 2: You review the proposals: one decision per listing, and flagged rows one by one. Nothing reaches the catalog without your approval. Step 3: `archive merge` shows a dry run, then `--apply` writes the approved rows to the catalog in this repo and gives each new document a `doc_id`. It never overwrites a value you reviewed. Step 4: `archive download` saves emergency response files to the Shared Drive&#x27;s `raw/` folder and records each file&#x27;s SHA-256 fingerprint. Monitoring documents stay `link_only`: cataloged and linked, not downloaded. Step 5: `archive verify` checks every saved file against its recorded fingerprint, so a changed or damaged file is caught. Step 6: `archive publish` writes read-only copies of the catalog and an index for each zone, for the Explorer, the Evidence Tracer and the team database. Step 7: GitHub Actions runs the tests and catalog checks on every change and checks the live site weekly. Any time, `uv run archive status` shows plain counts by zone and status." srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;

&lt;div class=&quot;stage&quot; role=&quot;img&quot; aria-label=&quot;Archive pipeline: one zone at a time, in 7 steps. Step 1: `archive discover` reads every zone page and library listing on the Safe Waters site, plus the Navy and DOH files they link to, and proposes catalog rows. Its dated report lists new files, changed files and files the site no longer shows. Step 2: You review the proposals: one decision per listing, and flagged rows one by one. Nothing reaches the catalog without your approval. Step 3: `archive merge` shows a dry run, then `--apply` writes the approved rows to the catalog in this repo and gives each new document a `doc_id`. It never overwrites a value you reviewed. Step 4: `archive download` saves emergency response files to the Shared Drive&amp;#x27;s `raw/` folder and records each file&amp;#x27;s SHA-256 fingerprint. Monitoring documents stay `link_only`: cataloged and linked, not downloaded. Step 5: `archive verify` checks every saved file against its recorded fingerprint, so a changed or damaged file is caught. Step 6: `archive publish` writes read-only copies of the catalog and an index for each zone, for the Explorer, the Evidence Tracer and the team database. Step 7: GitHub Actions runs the tests and catalog checks on every change and checks the live site weekly. Any time, `uv run archive status` shows plain counts by zone and status.&quot;&gt;&lt;div class=&quot;frame&quot; aria-hidden=&quot;true&quot;&gt;&lt;svg version=&quot;1.1&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 1620 920&quot; width=&quot;3240&quot; height=&quot;1840&quot;&gt;&lt;!-- svg-source:excalidraw --&gt;&lt;metadata&gt;&lt;/metadata&gt;&lt;defs&gt;&lt;style class=&quot;style-fonts&quot;&gt;

&lt;script&gt;
const captions = [&quot;`archive discover` reads every zone page and library listing on the Safe Waters site, plus the Navy and DOH files they link to, and proposes catalog rows. Its dated report lists new files, changed files and files the site no longer shows.&quot;, &quot;You review the proposals: one decision per listing, and flagged rows one by one. Nothing reaches the catalog without your approval.&quot;, &quot;`archive merge` shows a dry run, then `--apply` writes the approved rows to the catalog in this repo and gives each new document a `doc_id`. It never overwrites a value you reviewed.&quot;, &quot;`archive download` saves emergency response files to the Shared Drive&#x27;s `raw/` folder and records each file&#x27;s SHA-256 fingerprint. Monitoring documents stay `link_only`: cataloged and linked, not downloaded.&quot;, &quot;`archive verify` checks every saved file against its recorded fingerprint, so a changed or damaged file is caught.&quot;, &quot;`archive publish` writes read-only copies of the catalog and an index for each zone, for the Explorer, the Evidence Tracer and the team database.&quot;, &quot;GitHub Actions runs the tests and catalog checks on every change and checks the live site weekly. Any time, `uv run archive status` shows plain counts by zone and status.&quot;];
const frames = [...document.querySelectorAll(&quot;.frame&quot;)], get = (id) =&gt; document.getElementById(id);
let step = 0, timer = null;
function show(k) {
  step = (k + frames.length) % frames.length;
  frames.forEach((f, i) =&gt; f.classList.toggle(&quot;on&quot;, i === step));
  get(&quot;status&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; / &quot; + frames.length;
  get(&quot;steplabel&quot;).textContent = &quot;Step &quot; + (step + 1) + &quot; of &quot; + frames.length;
  get(&quot;caption&quot;).textContent = captions[step];
  get(&quot;back&quot;).disabled = step === 0;
}
function stop() { clearInterval(timer); timer = null; get(&quot;play&quot;).textContent = &quot;Play&quot;; }
function play() {
  if (timer) { stop(); return; }
  get(&quot;play&quot;).textContent = &quot;Pause&quot;;
  timer = setInterval(() =&gt; show(step + 1), 4000);
}
get(&quot;next&quot;).onclick = () =&gt; { stop(); show(step + 1); };
get(&quot;back&quot;).onclick = () =&gt; { stop(); show(step - 1); };
get(&quot;play&quot;).onclick = play;
document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;ArrowRight&quot;) { stop(); show(step + 1); }
  if (e.key === &quot;ArrowLeft&quot; &amp;&amp; step &gt; 0) { stop(); show(step - 1); }
});
// Let a notebook keep scrolling when the mouse wheel is over the figure.
addEventListener(&quot;wheel&quot;, (e) =&gt; frameElement?.dispatchEvent(new WheelEvent(&quot;wheel&quot;, e)), {passive: true});
// Grow or shrink the surrounding frame to fit the drawing and caption at any width.
function fit() { if (frameElement) frameElement.style.height = document.body.offsetHeight + &quot;px&quot;; }
addEventListener(&quot;load&quot;, fit);
addEventListener(&quot;resize&quot;, fit);
show(0);
